<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AMR Project">
  <rect width="32" height="32" rx="6" fill="#f7f8f6"/>
  <!-- The skew lifts the right-hand bars; this offset recentres their visual bounds. -->
  <g transform="translate(5 13)">
    <rect width="5" height="14" rx="1" fill="#102e32" transform="skewY(-25)"/>
    <rect x="8" width="5" height="19" rx="1" fill="#087b78" transform="skewY(-25)"/>
    <rect x="16" width="5" height="10" rx="1" fill="#f18b54" transform="skewY(-25)"/>
  </g>
</svg>
